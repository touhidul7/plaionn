<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="arenaGlow" cx="50%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#142634" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#0c1720" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#071017" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="iceRink" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#101e28" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#172b38" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#091219" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="spotlightLime" cx="50%" cy="10%" r="45%">
      <stop offset="0%" stop-color="#c7f450" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#c7f450" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="spotlightWhite" cx="25%" cy="15%" r="35%">
      <stop offset="0%" stop-color="#edf6f8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#edf6f8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="centerLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0" />
      <stop offset="50%" stop-color="#ef4444" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Arena Background -->
  <rect width="1920" height="600" fill="url(#arenaGlow)" />

  <!-- Subtle Overhead Lighting -->
  <rect width="1920" height="600" fill="url(#spotlightLime)" />
  <rect width="1920" height="600" fill="url(#spotlightWhite)" />

  <!-- Arena Glass & Ice Perspective -->
  <path d="M0,380 L1920,380 L1920,600 L0,600 Z" fill="url(#iceRink)" />

  <!-- Center Ice Red Line & Circle -->
  <path d="M0,520 L1920,520" stroke="url(#centerLine)" stroke-width="4" stroke-dasharray="16,8" opacity="0.6" />
  <ellipse cx="960" cy="520" rx="260" ry="60" fill="none" stroke="#293f4a" stroke-width="3" opacity="0.5" />
  <ellipse cx="960" cy="520" rx="30" ry="8" fill="#ef4444" opacity="0.4" />

  <!-- Arena Dasher Board Graphic -->
  <path d="M0,420 L1920,420" stroke="#293f4a" stroke-width="4" opacity="0.6" />
  <path d="M0,424 L1920,424" stroke="#c7f450" stroke-width="2" opacity="0.3" />

  <!-- Subtle Ice Dust Particles -->
  <circle cx="340" cy="180" r="1.5" fill="#edf6f8" opacity="0.3" />
  <circle cx="890" cy="120" r="2" fill="#c7f450" opacity="0.25" />
  <circle cx="1450" cy="220" r="1.5" fill="#edf6f8" opacity="0.3" />
</svg>